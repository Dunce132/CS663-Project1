<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Comparison of assistive technologies</title>
  <desc id="desc">A comparison of white canes, guide dogs, ultrasonic devices, camera-haptic systems, and Virtual Whiskers.</desc>
  <style>
    .title { font: bold 30px Arial, sans-serif; fill: #e5e7eb; }
    .heading { font: bold 23px Arial, sans-serif; fill: #ffffff; }
    .text { font: 19px Arial, sans-serif; fill: #cbd5e1; }
    .box { stroke: #64748b; stroke-width: 2; rx: 14; }
  </style>
  <rect width="1200" height="720" rx="24" fill="#0f172a"/>
  <text x="600" y="55" text-anchor="middle" class="title">Existing Assistive Technologies</text>

  <rect x="50" y="95" width="530" height="550" rx="18" fill="#17233b" stroke="#22d3ee" stroke-width="2"/>
  <text x="315" y="140" text-anchor="middle" class="heading">Traditional aids</text>

  <rect x="90" y="180" width="450" height="115" class="box" fill="#21304d"/>
  <text x="115" y="220" class="heading">White cane</text>
  <text x="115" y="255" class="text">Direct contact • low cost</text>
  <text x="115" y="280" class="text">Limited sensing range</text>

  <rect x="90" y="335" width="450" height="115" class="box" fill="#21304d"/>
  <text x="115" y="375" class="heading">Guide dog</text>
  <text x="115" y="410" class="text">Behavioral guidance</text>
  <text x="115" y="435" class="text">Requires training and care</text>

  <rect x="90" y="490" width="450" height="115" class="box" fill="#21304d"/>
  <text x="115" y="530" class="heading">Basic mobility support</text>
  <text x="115" y="565" class="text">Reliable physical feedback</text>
  <text x="115" y="590" class="text">Less scene information</text>

  <rect x="620" y="95" width="530" height="550" rx="18" fill="#17233b" stroke="#a78bfa" stroke-width="2"/>
  <text x="885" y="140" text-anchor="middle" class="heading">Electronic and haptic aids</text>

  <rect x="660" y="180" width="450" height="115" class="box" fill="#312e81"/>
  <text x="685" y="220" class="heading">Ultrasonic device</text>
  <text x="685" y="255" class="text">Estimates distance</text>
  <text x="685" y="280" class="text">Limited scene understanding</text>

  <rect x="660" y="335" width="450" height="115" class="box" fill="#312e81"/>
  <text x="685" y="375" class="heading">Camera-haptic system</text>
  <text x="685" y="410" class="text">Direction, depth, and motion</text>
  <text x="685" y="435" class="text">Can be affected by latency</text>

  <rect x="660" y="490" width="450" height="115" class="box" fill="#312e81"/>
  <text x="685" y="530" class="heading">Virtual Whiskers</text>
  <text x="685" y="565" class="text">Open paths and obstacle depth</text>
  <text x="685" y="590" class="text">Uses multiple vibration units</text>
</svg>
