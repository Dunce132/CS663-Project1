<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Computer vision pipeline for haptic feedback</title>
  <desc id="desc">A camera scene is converted into object detection, spatial estimates, collision risk, and structured data for haptic encoding.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#17233b"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="cyanBox" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#164e63"/>
      <stop offset="1" stop-color="#0e7490"/>
    </linearGradient>
    <linearGradient id="purpleBox" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#312e81"/>
      <stop offset="1" stop-color="#6d28d9"/>
    </linearGradient>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#22d3ee"/>
    </marker>
    <style>
      .label { font-family: Arial, sans-serif; fill: #e5e7eb; }
      .small { font-size: 21px; }
      .body { font-size: 25px; font-weight: 700; }
      .detail { font-size: 19px; fill: #cbd5e1; }
      .line { stroke: #22d3ee; stroke-width: 5; fill: none; marker-end: url(#arrow); }
      .box { stroke: rgba(229,231,235,.25); stroke-width: 2; rx: 18; }
    </style>
  </defs>

  <rect width="1200" height="700" rx="28" fill="url(#background)"/>
  <text x="600" y="55" text-anchor="middle" class="label body" font-size="32">From Camera Frames to Spatial Information</text>

  <rect x="45" y="145" width="205" height="360" class="box" fill="#21304d"/>
  <text x="147" y="190" text-anchor="middle" class="label body">Camera frame</text>
  <rect x="75" y="220" width="145" height="150" rx="10" fill="#334155"/>
  <circle cx="145" cy="292" r="35" fill="#a78bfa" opacity=".8"/>
  <circle cx="145" cy="292" r="15" fill="#0f172a"/>
  <rect x="92" y="332" width="35" height="38" fill="#22d3ee" opacity=".9"/>
  <rect x="165" y="320" width="28" height="50" fill="#f59e0b" opacity=".9"/>
  <text x="147" y="415" text-anchor="middle" class="label detail">2D image sequence</text>
  <text x="147" y="450" text-anchor="middle" class="label detail">scene changes</text>

  <path d="M250 325 H315" class="line"/>

  <rect x="320" y="145" width="205" height="360" class="box" fill="url(#cyanBox)"/>
  <text x="422" y="190" text-anchor="middle" class="label body">Perception</text>
  <text x="345" y="250" class="label detail">• objects</text>
  <text x="345" y="290" class="label detail">• positions</text>
  <text x="345" y="330" class="label detail">• tracking</text>
  <text x="345" y="370" class="label detail">• confidence</text>
  <text x="422" y="450" text-anchor="middle" class="label small">detect and track</text>

  <path d="M525 325 H590" class="line"/>

  <rect x="595" y="145" width="205" height="360" class="box" fill="url(#cyanBox)"/>
  <text x="697" y="190" text-anchor="middle" class="label body">Spatial estimates</text>
  <text x="620" y="250" class="label detail">• direction: left</text>
  <text x="620" y="290" class="label detail">• depth: 1.8 m</text>
  <text x="620" y="330" class="label detail">• motion: toward</text>
  <text x="620" y="370" class="label detail">• confidence: 0.91</text>
  <text x="697" y="450" text-anchor="middle" class="label small">structured output</text>

  <path d="M800 325 H865" class="line"/>

  <rect x="870" y="145" width="285" height="360" class="box" fill="url(#purpleBox)"/>
  <text x="1012" y="190" text-anchor="middle" class="label body">Risk and priority</text>
  <text x="895" y="255" class="label detail">near + moving object</text>
  <text x="895" y="300" class="label detail">→ high collision risk</text>
  <text x="895" y="365" class="label detail">selected for feedback:</text>
  <text x="895" y="405" class="label detail">direction, distance, urgency</text>
  <text x="1012" y="465" text-anchor="middle" class="label small">send to haptic encoder</text>

  <text x="600" y="610" text-anchor="middle" class="label small" fill="#22d3ee">The output is not the original image—it is a prioritized spatial description.</text>
</svg>
